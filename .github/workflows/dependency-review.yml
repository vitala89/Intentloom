name: Dependency Review

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**/package.json"
      - "apps/**/package.json"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - ".github/workflows/dependency-review.yml"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # GHSA-fx2h-pf6j-xcff (CVE-2026-53571): vite server.fs.deny bypass via
          # Windows NTFS alternate data streams, transitively pulled in by
          # vitepress@1.6.4 (which hard-pins vite ^5.4.14; no patched 5.x
          # release exists, and vitepress has no stable release on a patched
          # vite major). Only reachable through `vite dev`/`vitepress dev`
          # exposed to the network with --host on Windows; this repository
          # never runs the dev server in CI or build scripts, only
          # `vitepress build`. Re-evaluate when vitepress ships a stable
          # release depending on a patched vite major.
          allow-ghsas: GHSA-fx2h-pf6j-xcff
