name: Harness Performance Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/application/**"
      - "packages/harness/**"
      - "packages/cli/**"
      - "docs/specs/AGENTIC_HARNESS_PERFORMANCE_BENCHMARK_SPEC.md"
      - ".github/workflows/harness-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark-matrix-observation:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} (reporting only)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run matrix-observation benchmark
        run: node packages/cli/dist/intentloom.cjs harness benchmark --profile matrix-observation --warmup 1 --samples 3 --json > benchmark-observation-${{ matrix.os }}-node${{ matrix.node }}.json
      - name: Display human-readable benchmark summary
        run: node packages/cli/dist/intentloom.cjs harness benchmark --profile matrix-observation --warmup 1 --samples 3
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-benchmark-matrix-${{ matrix.os }}-node${{ matrix.node }}
          path: benchmark-observation-${{ matrix.os }}-node${{ matrix.node }}.json
