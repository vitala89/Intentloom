name: Foundation Docs Format Helper

on:
  push:
    branches:
      - docs/foundation-workshop-evolutionary-architecture
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          docs/concepts/FOUNDATION_WORKSHOP_AND_EVOLUTIONARY_ARCHITECTURE.md
          docs/governance/FOUNDATION_FIRST_DEVELOPMENT_PRINCIPLES.md
          docs/roadmap/FOUNDATION_WORKSHOP_IMPLEMENTATION_PLAN.md
      - name: Print formatted documents
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const files = [
            'docs/concepts/FOUNDATION_WORKSHOP_AND_EVOLUTIONARY_ARCHITECTURE.md',
            'docs/governance/FOUNDATION_FIRST_DEVELOPMENT_PRINCIPLES.md',
            'docs/roadmap/FOUNDATION_WORKSHOP_IMPLEMENTATION_PLAN.md',
          ];
          for (const file of files) {
            const encoded = Buffer.from(readFileSync(file, 'utf8')).toString('base64');
            console.log(`BEGIN_FORMATTED_FILE ${file}`);
            console.log(encoded);
            console.log(`END_FORMATTED_FILE ${file}`);
          }
          NODE
